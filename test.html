<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to L.U.M.A.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="page-shell">

        <header class="site-header">
            <div class="header-inner">
                <a class="site-logo" href="index.html">
                    <span class="logo-name">L.U.M.A.</span>
                    <span class="logo-subtitle">
                        Lifestyle User Mood Awareness
                    </span>
                </a>
                <a href="about.html">About L.U.M.A.</a>
            </div>
        </header>

        <main class="auth-main">
            <section class="auth-card">

                <div class="auth-moon" aria-hidden="true">☾</div>

                <p class="eyebrow">WELCOME TO L.U.M.A.</p>
                <h1>Your music. Your moods. Your moon.</h1>

                <p class="auth-description">
                    Discover the patterns in your listening.
                    Every phase of you belongs here.
                </p>

                <div class="auth-tabs">
                    <button type="button" id="login-tab" aria-pressed="true">
                        Log in
                    </button>
                    <button type="button" id="signup-tab" aria-pressed="false">
                        Sign up
                    </button>
                </div>

                <form id="auth-form">

                    <div id="signup-fields" hidden>

                        <label for="signup-name">Display name</label>
                        <input id="signup-name" type="text" maxlength="80" autocomplete="nickname"
                            placeholder="What should L.U.M.A. call you?">

                        <label for="signup-birthday">Date of birth</label>
                        <input id="signup-birthday" type="date" autocomplete="bday">

                    </div>

                    <label for="auth-email">Email</label>
                    <input id="auth-email" type="email" autocomplete="email" required>

                    <label for="auth-password">Password</label>
                    <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>

                    <button type="submit" id="auth-submit">
                        Log in
                    </button>
                </form>

                <p id="auth-message" role="status" aria-live="polite"></p>

            </section>
        </main>

    </div>

    <script type="module" src="./js/auth-page.js"></script>
</body>

</html>
